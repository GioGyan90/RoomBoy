name: Head region LOD topology and candidate
on:
  push:
    branches: ['feat/head-region-lod-v1']
    paths:
      - 'scripts/audit-head-region-topology.py'
      - 'scripts/build-head-region-lod.py'
      - '.github/workflows/head-region-lod.yml'
      - 'scripts/render-head-region-lod.py'
      - 'tests/head-region-lod.test.ts'
permissions:
  contents: write
concurrency:
  group: head-region-lod-v1
  cancel-in-progress: false
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies for actual GLB mesh analysis
        run: python -m pip install "numpy>=1.26,<3" "trimesh>=4.5,<5" "vtk>=9.3,<10" "scipy>=1.11,<2" "matplotlib>=3.8,<4"
      - name: Audit master, all source parts and boundary locks
        run: python scripts/audit-head-region-topology.py
      - name: Run candidate generation only when present
        shell: bash
        run: |
          if [ -f scripts/build-head-region-lod.py ]; then
            python scripts/build-head-region-lod.py
          fi
      - name: Render matched source/candidate front, quarter, side, back and facial wireframe
        run: |
          if [ -f public/heads/grey-head-region-lod-v1.glb ]; then
            python scripts/render-head-region-lod.py
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run Node regression tests and production build on actual candidate
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload geometry image review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-region-lod-v1-review
          path: docs/images/head-region-lod-v1
          retention-days: 30
          if-no-files-found: warn
      - name: Upload unified and regional GLB candidate for detailed review
        uses: actions/upload-artifact@v4
        with:
          name: head-region-lod-v1-models
          path: |
            public/heads/grey-head-region-lod-v1.glb
            public/heads/grey-head-region-lod-v1.parts.glb
            public/heads/grey-head-region-lod-v1.parts.json
            public/heads/grey-head-region-lod-v1.report.json
          retention-days: 30
      - name: Commit generated assets onto latest task branch without binary rebase conflicts
        run: |
          mkdir -p /tmp/head-region-generated /tmp/head-region-images
          cp public/heads/grey-head-region-lod-v1.* /tmp/head-region-generated/
          cp -a docs/images/head-region-lod-v1/. /tmp/head-region-images/
          git fetch origin feat/head-region-lod-v1
          base_script=$(git rev-parse HEAD:scripts/build-head-region-lod.py)
          remote_script=$(git rev-parse origin/feat/head-region-lod-v1:scripts/build-head-region-lod.py)
          if [ "$base_script" != "$remote_script" ]; then
            echo 'Generator changed during CI; newer run must publish its own output'
            exit 1
          fi
          git reset --hard origin/feat/head-region-lod-v1
          mkdir -p docs/images/head-region-lod-v1
          cp -f /tmp/head-region-generated/* public/heads/
          cp -f /tmp/head-region-images/* docs/images/head-region-lod-v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/heads/grey-head-region-lod-v1.*
          git add docs/images/head-region-lod-v1/
          if ! git diff --cached --quiet; then
            git commit -m "asset(head): source-true 10K indexed GLB, 23 regions and visual audit [skip ci]"
            git push origin HEAD:feat/head-region-lod-v1
          fi
