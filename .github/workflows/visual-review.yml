name: Cruise cabin visual review
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/capture-cruise.mjs'
      - '.github/workflows/visual-review.yml'
      - 'package*.json'
  workflow_dispatch:
concurrency:
  group: cruise-visual-review
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Capture 12 cabin views
        env:
          CI: 'true'
        run: node scripts/capture-cruise.mjs
      - name: Publish QA contact sheet on separate review branch
        if: success()
        run: |
          git config user.name "room-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B cruise-visual-review
          mkdir -p docs/cruise-visual
          cp artifacts/cruise-review/contact-sheet.jpg docs/cruise-visual/contact-sheet.jpg
          cp artifacts/cruise-review/report.json docs/cruise-visual/report.json
          git add docs/cruise-visual/
          git commit -m "chore: refresh 12-angle cruise visual review (${GITHUB_SHA:0:8})"
          git push origin HEAD:refs/heads/cruise-visual-review --force
      - name: Upload temporary screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cruise-cabin-review
          path: artifacts/cruise-review/
          retention-days: 7
          if-no-files-found: warn
